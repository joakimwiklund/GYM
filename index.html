<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f0f0f">
<title>Träningsdagbok</title>
<link rel="manifest" href="manifest.json">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f0f0f; --surface: #1a1a1a; --surface2: #242424; --border: #2e2e2e;
    --accent: #c8f135; --accent-dim: #9ab82a; --text: #f0f0f0; --muted: #777;
    --radius: 12px; --font: 'DM Sans', sans-serif; --mono: 'DM Mono', monospace;
  }
  html, body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; -webkit-font-smoothing: antialiased; }
  header { position: sticky; top: 0; z-index: 100; background: var(--bg); border-bottom: 1px solid var(--border); padding: 14px 16px 0; }
  .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .logo { font-family: var(--mono); font-size: 13px; color: var(--accent); letter-spacing: .08em; text-transform: uppercase; }
  .streak { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .prog-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin: 0 -16px; overflow-x: auto; scrollbar-width: none; }
  .prog-tabs::-webkit-scrollbar { display: none; }
  .prog-tab { flex-shrink: 0; flex: 1; min-width: 70px; padding: 10px 6px; font-family: var(--font); font-size: 12px; font-weight: 500; color: var(--muted); background: transparent; border: none; border-bottom: 2px solid transparent; cursor: pointer; transition: all .15s; text-align: center; white-space: nowrap; }
  .prog-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .day-tabs-wrap { padding: 12px 16px 0; background: var(--bg); position: sticky; top: 89px; z-index: 99; border-bottom: 1px solid var(--border); }
  .day-tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 12px; }
  .day-tabs::-webkit-scrollbar { display: none; }
  .day-tab { flex-shrink: 0; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-family: var(--font); font-size: 13px; font-weight: 500; cursor: pointer; transition: all .15s; white-space: nowrap; }
  .day-tab.active { background: var(--accent); border-color: var(--accent); color: #0f0f0f; }
  main { padding: 16px 16px 100px; }
  .prog-panel { display: none; }
  .prog-panel.active { display: block; }
  .day-panel { display: none; }
  .day-panel.active { display: block; }
  .day-header { margin-bottom: 12px; }
  .day-label { font-family: var(--mono); font-size: 11px; color: var(--accent); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 4px; }
  .day-name { font-size: 22px; font-weight: 600; color: var(--text); line-height: 1.2; }
  .exercise-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; }
  .ex-header { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
  .ex-number { width: 24px; height: 24px; border-radius: 50%; background: var(--surface2); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 11px; color: var(--muted); flex-shrink: 0; margin-top: 2px; }
  .ex-name { font-size: 15px; font-weight: 500; color: var(--text); line-height: 1.2; }
  .ex-sets-info { font-size: 12px; color: var(--muted); font-family: var(--mono); margin-top: 2px; }
  .badge { display: inline-block; font-size: 10px; font-family: var(--mono); padding: 2px 7px; border-radius: 999px; background: var(--surface2); color: var(--accent-dim); border: 1px solid #3a3a3a; margin-top: 4px; }
  .sets-grid-header { display: grid; grid-template-columns: 32px 1fr 1fr; gap: 6px; margin-bottom: 6px; }
  .col-label { font-size: 11px; color: var(--muted); font-family: var(--mono); letter-spacing: .05em; text-transform: uppercase; text-align: center; }
  .sets-grid { display: grid; grid-template-columns: 32px 1fr 1fr; gap: 6px; align-items: center; }
  .set-num { font-family: var(--mono); font-size: 12px; color: var(--muted); text-align: center; }
  .set-input { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 9px 8px; font-family: var(--mono); font-size: 15px; color: var(--text); text-align: center; width: 100%; outline: none; transition: border-color .15s; -webkit-appearance: none; appearance: none; }
  .set-input::placeholder { color: #444; }
  .set-input:focus { border-color: var(--accent); }
  .set-input.filled { border-color: #3a3a3a; color: var(--accent); }
  .save-row { margin-top: 12px; display: flex; align-items: center; justify-content: space-between; }
  .clear-btn { background: transparent; border: 1px solid var(--border); border-radius: 8px; padding: 9px 14px; font-family: var(--font); font-size: 13px; color: var(--muted); cursor: pointer; }
  .saved-indicator { font-family: var(--mono); font-size: 12px; color: var(--accent-dim); opacity: 0; transition: opacity .3s; }
  .saved-indicator.show { opacity: 1; }
  .tip { margin: 4px 0 16px; padding: 10px 14px; background: var(--surface); border-left: 2px solid var(--accent); font-size: 13px; color: var(--muted); line-height: 1.5; }

  /* FOOD & RECIPES */
  .food-section-title { font-family: var(--mono); font-size: 11px; color: var(--accent); letter-spacing: .1em; text-transform: uppercase; margin: 20px 0 10px; }
  .macro-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .macro-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
  .macro-num { font-family: var(--mono); font-size: 22px; font-weight: 500; color: var(--accent); }
  .macro-unit { font-family: var(--mono); font-size: 12px; color: var(--accent-dim); }
  .macro-label { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .tip-food { margin: 0 0 16px; padding: 10px 14px; background: var(--surface); border-left: 2px solid #c87835; font-size: 13px; color: var(--muted); line-height: 1.5; }

  /* PROTEIN SOURCE ACCORDION */
  .protein-source { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 10px; overflow: hidden; }
  .protein-header { display: flex; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer; }
  .protein-icon { font-size: 26px; flex-shrink: 0; }
  .protein-title-wrap { flex: 1; }
  .protein-name { font-size: 16px; font-weight: 600; color: var(--text); }
  .protein-sub { font-size: 12px; color: var(--muted); font-family: var(--mono); margin-top: 2px; }
  .protein-arrow { font-size: 14px; color: var(--muted); transition: transform .2s; }
  .protein-arrow.open { transform: rotate(180deg); }
  .protein-recipes { display: none; border-top: 1px solid var(--border); }
  .protein-recipes.open { display: block; }
  .recipe-item { padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .recipe-item:last-child { border-bottom: none; }
  .recipe-name { font-size: 14px; font-weight: 600; color: var(--accent-dim); margin-bottom: 6px; }
  .recipe-ing-title { font-size: 11px; font-family: var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin: 8px 0 4px; }
  .recipe-ing { font-size: 13px; color: var(--muted); line-height: 1.7; }
  .recipe-steps-title { font-size: 11px; font-family: var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin: 8px 0 4px; }
  .recipe-step { font-size: 13px; color: var(--muted); line-height: 1.6; margin-bottom: 4px; display: flex; gap: 8px; }
  .recipe-step-num { font-family: var(--mono); font-size: 11px; color: var(--accent); flex-shrink: 0; margin-top: 2px; }
  .recipe-macros { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .rmac { font-size: 11px; font-family: var(--mono); padding: 2px 8px; border-radius: 999px; border: 1px solid #3a4a1a; background: #1a2410; color: #c8f135; }

  /* OVERNIGHT OATS */
  .oats-intro { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
  .oats-intro-title { font-size: 17px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .oats-intro-text { font-size: 13px; color: var(--muted); line-height: 1.6; }

  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg); border-top: 1px solid var(--border); padding: 10px 16px 20px; display: flex; gap: 8px; }
  .nav-btn { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 8px; font-family: var(--font); font-size: 12px; font-weight: 500; color: var(--muted); cursor: pointer; text-align: center; }
  .nav-btn.active { background: var(--surface2); border-color: var(--accent); color: var(--accent); }
  .nav-icon { font-size: 18px; display: block; margin-bottom: 3px; }
</style>
</head>

var currentProg=0, currentDays=[0,0,0,0,0], currentView='log';

function sKey(pi,di,ei,si,f){return 'gym_p'+pi+'_d'+di+'_e'+ei+'_s'+si+'_'+f;}
function hKey(pi,di,ei,si,f){var t=new Date().toISOString().split('T')[0];return 'gym_hist_'+t+'_p'+pi+'_d'+di+'_e'+ei+'_s'+si+'_'+f;}
function saveVal(pi,di,ei,si,f,v){try{localStorage.setItem(sKey(pi,di,ei,si,f),v);localStorage.setItem(hKey(pi,di,ei,si,f),v);}catch(e){}}
function loadVal(pi,di,ei,si,f){try{return localStorage.getItem(sKey(pi,di,ei,si,f))||'';}catch(e){return '';}}

function buildProgTabs(){
  var c=document.getElementById('prog-tabs');
  c.innerHTML=PROGRAMS.map(function(p,i){
    return '<button class="prog-tab'+(i===0?' active':'')+'" onclick="switchProg('+i+')">'+p.label+'</button>';
  }).join('');
}

function buildDayTabs(){
  var prog=PROGRAMS[currentProg];
  var wrap=document.getElementById('day-tabs-wrap');
  if(prog.food||prog.oats){wrap.style.display='none';return;}
  wrap.style.display='block';
  var c=document.getElementById('day-tabs');
  var cd=currentDays[currentProg];
  c.innerHTML=prog.days.map(function(d,i){
    return '<button class="day-tab'+(i===cd?' active':'')+'" onclick="switchDay('+i+')">'+d.shortTab+'</button>';
  }).join('');
}

function renderFood(){

  html+='<div class="food-section-title">Välj proteinkälla</div>';
  PROTEINS.forEach(function(p,pi){
    html+='<div class="protein-source">';

    html+='</div>';
    html+='<div class="protein-recipes" id="recipes-'+pi+'">';
    p.recipes.forEach(function(r,ri){
      html+='<div class="recipe-item">';
      html+='<div class="recipe-name">'+r.name+'</div>';
      html+='<div class="recipe-ing-title">Ingredienser</div>';
      html+='<div class="recipe-ing">'+r.ing+'</div>';
      html+='<div class="recipe-steps-title">Tillagning</div>';

function renderLog(){
  var main=document.getElementById('main-content');
  var prog=PROGRAMS[currentProg];
  if(prog.food){main.innerHTML=renderFood();return;}
  if(prog.oats){main.innerHTML=renderOats();return;}
  var cd=currentDays[currentProg];
  var html='';
  prog.days.forEach(function(day,di){
    html+='<div class="day-panel'+(di===cd?' active':'')+'" id="panel-'+di+'">';
    html+='<div class="day-header"><div class="day-label">'+day.day+'</div><div class="day-name">'+day.name+'</div></div>';
    html+='<div class="tip">'+day.tip+'</div>';
    day.exercises.forEach(function(ex,ei){
      html+='<div class="exercise-card"><div class="ex-header"><div class="ex-number">'+(ei+1)+'</div><div><div class="ex-name">'+ex.name+'</div><div class="ex-sets-info">'+ex.sets+' set · '+ex.reps+' reps · '+ex.rest+' vila</div>'+(ex.badge?'<span class="badge">'+ex.badge+'</span>':'')+'</div></div>';
      html+='<div class="sets-grid-header"><div class="col-label">Set</div><div class="col-label">Vikt (kg)</div><div class="col-label">Reps</div></div><div class="sets-grid">';
      for(var s=0;s<ex.sets;s++){
        var kg=loadVal(currentProg,di,ei,s,'kg'),rp=loadVal(currentProg,di,ei,s,'reps');
        html+='<div class="set-num">'+(s+1)+'</div>';
        html+='<input class="set-input'+(kg?' filled':'')+'" type="number" inputmode="decimal" placeholder="—" value="'+kg+'" data-prog="'+currentProg+'" data-day="'+di+'" data-ex="'+ei+'" data-set="'+s+'" data-field="kg" oninput="handleInput(this)">';
        html+='<input class="set-input'+(rp?' filled':'')+'" type="number" inputmode="numeric" placeholder="—" value="'+rp+'" data-prog="'+currentProg+'" data-day="'+di+'" data-ex="'+ei+'" data-set="'+s+'" data-field="reps" oninput="handleInput(this)">';
      }
      html+='</div><div class="save-row"><button class="clear-btn" onclick="clearEx('+currentProg+','+di+','+ei+')">Rensa</button><span class="saved-indicator" id="saved-'+currentProg+'-'+di+'-'+ei+'">✓ sparat</span></div></div>';
    });
    html+='</div>';
  });
  main.innerHTML=html;
}

function toggleProtein(pi){
  var r=document.getElementById('recipes-'+pi);
  var a=document.getElementById('arrow-'+pi);
  var open=r.classList.contains('open');
  r.classList.toggle('open',!open);
  a.classList.toggle('open',!open);
}

function renderHistory(){
  var main=document.getElementById('main-content');
  var html='<div style="padding-top:8px"><div style="font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:.1em;text-transform:uppercase;margin-bottom:16px">Träningshistorik</div>';
  var allKeys=[];
  try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.startsWith('gym_hist_'))allKeys.push(k);}}catch(e){}
  var dates={};
  allKeys.forEach(function(k){var p=k.split('_');var d=p[2];if(!dates[d])dates[d]=[];dates[d].push(k);});
  var sorted=Object.keys(dates).sort().reverse();
  if(!sorted.length){html+='<div style="color:var(--muted);font-size:14px;margin-top:40px;text-align:center">Inga sparade pass ännu.<br><br>Logga ditt första pass!</div>';}
  else{
    sorted.forEach(function(date){
      html+='<div style="margin-bottom:20px"><div style="font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:10px">'+formatDate(date)+'</div>';
      var logged={};
      dates[date].forEach(function(k){
        var m=k.match(/gym_hist_[\d-]+_p(\d+)_d(\d+)_e(\d+)_s(\d+)_(\w+)/);
        if(!m)return;
        var key2=m[1]+'_'+m[2]+'_'+m[3]+'_'+m[4];
        if(!logged[key2])logged[key2]={pi:m[1],di:m[2],ei:m[3],si:m[4]};
        try{logged[key2][m[5]]=localStorage.getItem(k);}catch(e){}
      });
      var grouped={};
      Object.values(logged).forEach(function(e){var gk=e.pi+'_'+e.di+'_'+e.ei;if(!grouped[gk])grouped[gk]={pi:e.pi,di:e.di,ei:e.ei,sets:[]};grouped[gk].sets.push(e);});
      Object.values(grouped).forEach(function(g){
        var prog=PROGRAMS[g.pi];if(!prog||prog.food||prog.oats)return;
        var day=prog.days[g.di];if(!day)return;
        var ex=day.exercises[g.ei];if(!ex)return;
        html+='<div class="exercise-card" style="margin-bottom:8px">';
        html+='<div style="font-family:var(--mono);font-size:10px;color:var(--muted);margin-bottom:4px">'+prog.label+' · '+day.shortTab+'</div>';
        html+='<div class="ex-name" style="margin-bottom:8px">'+ex.name+'</div>';
        g.sets.sort(function(a,b){return a.si-b.si;}).forEach(function(s){
          if(s.kg||s.reps)html+='<div style="display:flex;gap:8px;font-family:var(--mono);font-size:13px;color:var(--muted);margin-bottom:4px"><span style="color:#444">Set '+(parseInt(s.si)+1)+'</span>'+(s.kg?'<span style="color:var(--accent)">'+s.kg+' kg</span>':'')+' '+(s.reps?'<span>'+s.reps+' reps</span>':'')+'</div>';
        });
        html+='</div>';
      });
      html+='</div>';
    });
  }
  main.innerHTML=html+'</div>';
}

function formatDate(d){return new Date(d+'T12:00:00').toLocaleDateString('sv-SE',{weekday:'long',day:'numeric',month:'long'});}
function handleInput(el){
  var pi=el.dataset.prog,di=el.dataset.day,ei=el.dataset.ex,si=el.dataset.set,f=el.dataset.field;
  saveVal(pi,di,ei,si,f,el.value);
  el.classList.toggle('filled',!!el.value);
  var ind=document.getElementById('saved-'+pi+'-'+di+'-'+ei);
  if(ind){ind.classList.add('show');setTimeout(function(){ind.classList.remove('show');},1500);}
}
function clearEx(pi,di,ei){
  var prog=PROGRAMS[pi];if(!prog||prog.food||prog.oats)return;
  var ex=prog.days[di].exercises[ei];
  for(var s=0;s<ex.sets;s++){
    try{localStorage.removeItem(sKey(pi,di,ei,s,'kg'));localStorage.removeItem(sKey(pi,di,ei,s,'reps'));}catch(e){}
    ['kg','reps'].forEach(function(f){var el=document.querySelector('input[data-prog="'+pi+'"][data-day="'+di+'"][data-ex="'+ei+'"][data-set="'+s+'"][data-field="'+f+'"]');if(el){el.value='';el.classList.remove('filled');}});
  }
}
function switchProg(idx){
  currentProg=idx;
  document.querySelectorAll('.prog-tab').forEach(function(t,i){t.classList.toggle('active',i===idx);});
  buildDayTabs();
  if(currentView==='log')renderLog();
}
function switchDay(idx){
  currentDays[currentProg]=idx;
  document.querySelectorAll('.day-tab').forEach(function(t,i){t.classList.toggle('active',i===idx);});
  document.querySelectorAll('.day-panel').forEach(function(p,i){p.classList.toggle('active',i===idx);});
}
function setView(view){
  currentView=view;
  document.querySelectorAll('.nav-btn').forEach(function(b,i){b.classList.toggle('active',(i===0&&view==='log')||(i===1&&view==='history'));});
  var wrap=document.getElementById('day-tabs-wrap');
  if(view==='history'){wrap.style.display='none';renderHistory();}
  else{buildDayTabs();renderLog();}
}
function updateStreak(){
  try{
    var today=new Date().toISOString().split('T')[0];
    var last=localStorage.getItem('gym_last_visit');
    var streak=parseInt(localStorage.getItem('gym_streak')||'0');
    if(last!==today){
      var yesterday=new Date(Date.now()-86400000).toISOString().split('T')[0];
      streak=last===yesterday?streak+1:1;
      localStorage.setItem('gym_last_visit',today);
      localStorage.setItem('gym_streak',streak);
    }
    if(streak>1)document.getElementById('streak-display').textContent='🔥 '+streak+' dagar';
  }catch(e){}
}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}
buildProgTabs(); buildDayTabs(); updateStreak(); renderLog();
</script>
</body>
</html>
