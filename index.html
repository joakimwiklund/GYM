<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Träningsdagbok</title>
<link rel="manifest" href="manifest.json">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f0f0f; --surface: #1a1a1a; --surface2: #242424; --border: #2e2e2e;
    --accent: #c8f135; --accent-dim: #9ab82a; --text: #f0f0f0; --muted: #777;
    --radius: 12px; --font: 'DM Sans', sans-serif; --mono: 'DM Mono', monospace;
  }
  html, body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; -webkit-font-smoothing: antialiased; }
  header { position: sticky; top: 0; z-index: 100; background: var(--bg); border-bottom: 1px solid var(--border); padding: 14px 16px 0; }
  .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .logo { font-family: var(--mono); font-size: 13px; color: var(--accent); letter-spacing: .08em; text-transform: uppercase; }
  .streak { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .prog-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin: 0 -16px; overflow-x: auto; scrollbar-width: none; }
  .prog-tabs::-webkit-scrollbar { display: none; }
  .prog-tab { flex-shrink: 0; flex: 1; min-width: 65px; padding: 10px 4px; font-family: var(--font); font-size: 12px; font-weight: 500; color: var(--muted); background: transparent; border: none; border-bottom: 2px solid transparent; cursor: pointer; transition: all .15s; text-align: center; white-space: nowrap; }
  .prog-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .day-tabs-wrap { padding: 12px 16px 0; background: var(--bg); position: sticky; top: 89px; z-index: 99; border-bottom: 1px solid var(--border); }
  .day-tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 12px; }
  .day-tabs::-webkit-scrollbar { display: none; }
  .day-tab { flex-shrink: 0; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-family: var(--font); font-size: 13px; font-weight: 500; cursor: pointer; transition: all .15s; white-space: nowrap; }
  .day-tab.active { background: var(--accent); border-color: var(--accent); color: #0f0f0f; }
  main { padding: 16px 16px 100px; }
  .day-panel { display: none; }
  .day-panel.active { display: block; }
  .day-header { margin-bottom: 12px; }
  .day-label { font-family: var(--mono); font-size: 11px; color: var(--accent); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 4px; }
  .day-name { font-size: 22px; font-weight: 600; color: var(--text); line-height: 1.2; }
  .exercise-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; }
  .ex-header { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
  .ex-number { width: 24px; height: 24px; border-radius: 50%; background: var(--surface2); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 11px; color: var(--muted); flex-shrink: 0; margin-top: 2px; }
  .ex-name { font-size: 15px; font-weight: 500; color: var(--text); line-height: 1.2; }
  .ex-sets-info { font-size: 12px; color: var(--muted); font-family: var(--mono); margin-top: 2px; }
  .badge { display: inline-block; font-size: 10px; font-family: var(--mono); padding: 2px 7px; border-radius: 999px; background: var(--surface2); color: var(--accent-dim); border: 1px solid #3a3a3a; margin-top: 4px; }
  .sets-grid-header { display: grid; grid-template-columns: 32px 1fr 1fr; gap: 6px; margin-bottom: 6px; }
  .col-label { font-size: 11px; color: var(--muted); font-family: var(--mono); letter-spacing: .05em; text-transform: uppercase; text-align: center; }
  .sets-grid { display: grid; grid-template-columns: 32px 1fr 1fr; gap: 6px; align-items: center; }
  .set-num { font-family: var(--mono); font-size: 12px; color: var(--muted); text-align: center; }
  .set-input { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 9px 8px; font-family: var(--mono); font-size: 15px; color: var(--text); text-align: center; width: 100%; outline: none; transition: border-color .15s; -webkit-appearance: none; appearance: none; }
  .set-input::placeholder { color: #444; }
  .set-input:focus { border-color: var(--accent); }
  .set-input.filled { border-color: #3a3a3a; color: var(--accent); }
  .save-row { margin-top: 12px; display: flex; align-items: center; justify-content: space-between; }
  .clear-btn { background: transparent; border: 1px solid var(--border); border-radius: 8px; padding: 9px 14px; font-family: var(--font); font-size: 13px; color: var(--muted); cursor: pointer; }
  .saved-indicator { font-family: var(--mono); font-size: 12px; color: var(--accent-dim); opacity: 0; transition: opacity .3s; }
  .saved-indicator.show { opacity: 1; }
  .tip { margin: 4px 0 16px; padding: 10px 14px; background: var(--surface); border-left: 2px solid var(--accent); font-size: 13px; color: var(--muted); line-height: 1.5; }
  .food-section-title { font-family: var(--mono); font-size: 11px; color: var(--accent); letter-spacing: .1em; text-transform: uppercase; margin: 20px 0 10px; }
  .macro-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .macro-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
  .macro-num { font-family: var(--mono); font-size: 22px; font-weight: 500; color: var(--accent); }
  .macro-unit { font-family: var(--mono); font-size: 12px; color: var(--accent-dim); }
  .macro-label { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .tip-food { margin: 0 0 16px; padding: 10px 14px; background: var(--surface); border-left: 2px solid #c87835; font-size: 13px; color: var(--muted); line-height: 1.5; }
  .protein-source { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 10px; overflow: hidden; }
  .protein-header { display: flex; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer; }
  .protein-icon { font-size: 26px; flex-shrink: 0; }
  .protein-title-wrap { flex: 1; }
  .protein-name { font-size: 16px; font-weight: 600; color: var(--text); }
  .protein-sub { font-size: 12px; color: var(--muted); font-family: var(--mono); margin-top: 2px; }
  .protein-arrow { font-size: 14px; color: var(--muted); transition: transform .2s; }
  .protein-arrow.open { transform: rotate(180deg); }
  .protein-recipes { display: none; border-top: 1px solid var(--border); }
  .protein-recipes.open { display: block; }
  .recipe-item { padding: 14px 16px; border-bottom: 1px solid var(--border); position: relative; }
  .recipe-item:last-child { border-bottom: none; }
  .recipe-item.user-added { border-left: 3px solid var(--accent); }
  .recipe-name { font-size: 14px; font-weight: 600; color: var(--accent-dim); margin-bottom: 6px; }
  .recipe-ing-title { font-size: 11px; font-family: var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin: 8px 0 4px; }
  .recipe-ing { font-size: 13px; color: var(--muted); line-height: 1.7; }
  .recipe-steps-title { font-size: 11px; font-family: var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin: 8px 0 4px; }
  .recipe-step { font-size: 13px; color: var(--muted); line-height: 1.6; margin-bottom: 4px; display: flex; gap: 8px; }
  .recipe-step-num { font-family: var(--mono); font-size: 11px; color: var(--accent); flex-shrink: 0; margin-top: 2px; }
  .recipe-macros { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .rmac { font-size: 11px; font-family: var(--mono); padding: 2px 8px; border-radius: 999px; border: 1px solid #3a4a1a; background: #1a2410; color: #c8f135; }
  .delete-recipe-btn { position: absolute; top: 12px; right: 14px; background: transparent; border: 1px solid #3a1a1a; border-radius: 6px; padding: 3px 8px; font-size: 11px; color: #884444; cursor: pointer; }

  /* SCAN BUTTON */
  .scan-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 12px; background: var(--surface2); border: 1px dashed var(--accent-dim); border-radius: var(--radius); color: var(--accent-dim); font-family: var(--font); font-size: 14px; font-weight: 500; cursor: pointer; margin-top: 2px; transition: all .15s; }
  .scan-btn:active { background: #1a2410; }

  /* SCAN MODAL */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85); z-index: 200; align-items: flex-end; justify-content: center; }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--surface); border-radius: 20px 20px 0 0; padding: 24px 20px 40px; width: 100%; max-width: 500px; }
  .modal-title { font-size: 18px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .modal-sub { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
  .modal-target { font-family: var(--mono); font-size: 12px; color: var(--accent); margin-bottom: 16px; }
  .upload-area { border: 2px dashed var(--border); border-radius: var(--radius); padding: 30px; text-align: center; cursor: pointer; margin-bottom: 16px; transition: border-color .15s; }
  .upload-area:active { border-color: var(--accent); }
  .upload-icon { font-size: 36px; margin-bottom: 8px; }
  .upload-text { font-size: 14px; color: var(--muted); }
  .upload-text span { color: var(--accent); }
  .preview-img { width: 100%; border-radius: var(--radius); margin-bottom: 16px; max-height: 200px; object-fit: cover; display: none; }
  .modal-btn { width: 100%; padding: 14px; border-radius: var(--radius); font-family: var(--font); font-size: 15px; font-weight: 600; cursor: pointer; border: none; margin-bottom: 10px; }
  .modal-btn.primary { background: var(--accent); color: #0f0f0f; }
  .modal-btn.primary:disabled { background: #3a4a1a; color: #5a6a2a; cursor: not-allowed; }
  .modal-btn.secondary { background: transparent; border: 1px solid var(--border); color: var(--muted); }
  .scan-status { font-size: 13px; color: var(--accent-dim); text-align: center; margin-bottom: 12px; font-family: var(--mono); min-height: 20px; }

  .apikey-section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
  .apikey-title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .apikey-text { font-size: 13px; color: var(--muted); line-height: 1.6; margin-bottom: 12px; }
  .apikey-input { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-family: var(--mono); font-size: 13px; color: var(--text); outline: none; margin-bottom: 8px; }
  .apikey-input:focus { border-color: var(--accent); }
  .apikey-save-btn { background: var(--accent); border: none; border-radius: 8px; padding: 10px 18px; font-family: var(--font); font-size: 13px; font-weight: 600; color: #0f0f0f; cursor: pointer; }
  .apikey-saved { font-size: 12px; color: var(--accent-dim); font-family: var(--mono); margin-left: 8px; }

  /* OATS */
  .oats-intro { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
  .oats-intro-title { font-size: 17px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .oats-intro-text { font-size: 13px; color: var(--muted); line-height: 1.6; }

  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg); border-top: 1px solid var(--border); padding: 10px 16px 20px; display: flex; gap: 8px; }
  .nav-btn { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 8px; font-family: var(--font); font-size: 12px; font-weight: 500; color: var(--muted); cursor: pointer; text-align: center; }
  .nav-btn.active { background: var(--surface2); border-color: var(--accent); color: var(--accent); }
  .nav-icon { font-size: 18px; display: block; margin-bottom: 3px; }
  input[type=file] { display: none; }
</style>
</head>
<body>
<input type="file" id="img-input" accept="image/*">

<header>
  <div class="header-top">
    <span class="logo">// Träning</span>
    <span class="streak" id="streak-display"></span>
  </div>
  <div class="prog-tabs" id="prog-tabs"></div>
</header>
<div class="day-tabs-wrap" id="day-tabs-wrap">
  <div class="day-tabs" id="day-tabs"></div>
</div>
<main id="main-content"></main>

<!-- SCAN MODAL -->
<div class="modal-overlay" id="scan-modal">
  <div class="modal">
    <div class="modal-title">📸 Scanna recept</div>
    <div class="modal-sub">Ta ett foto eller välj en bild på ett recept så läser AI:n av det automatiskt.</div>
    <div class="modal-target" id="modal-target-label"></div>
    <div class="upload-area" onclick="document.getElementById('img-input').click()">
      <div class="upload-icon">📷</div>
      <div class="upload-text">Tryck för att <span>ta foto eller välja bild</span></div>
    </div>
    <img class="preview-img" id="preview-img">
    <div class="scan-status" id="scan-status"></div>
    <button class="modal-btn primary" id="scan-go-btn" onclick="runScan()" disabled>Scanna recept</button>
    <button class="modal-btn secondary" onclick="closeModal()">Avbryt</button>
  </div>
</div>

<div class="bottom-nav">
  <button class="nav-btn active" onclick="setView('log')"><span class="nav-icon">📋</span>Logg</button>
  <button class="nav-btn" onclick="setView('history')"><span class="nav-icon">📈</span>Historik</button>
</div>

function sKey(pi,di,ei,si,f){return 'gym_p'+pi+'_d'+di+'_e'+ei+'_s'+si+'_'+f;}
function hKey(pi,di,ei,si,f){var t=new Date().toISOString().split('T')[0];return 'gym_hist_'+t+'_p'+pi+'_d'+di+'_e'+ei+'_s'+si+'_'+f;}
function saveVal(pi,di,ei,si,f,v){try{localStorage.setItem(sKey(pi,di,ei,si,f),v);localStorage.setItem(hKey(pi,di,ei,si,f),v);}catch(e){}}
function loadVal(pi,di,ei,si,f){try{return localStorage.getItem(sKey(pi,di,ei,si,f))||'';}catch(e){return '';}}

function getApiKey(){try{return localStorage.getItem('claude_api_key')||'';}catch(e){return '';}}
function setApiKey(k){try{localStorage.setItem('claude_api_key',k);}catch(e){}}
function getUserRecipes(pi){try{return JSON.parse(localStorage.getItem('user_recipes_'+pi)||'[]');}catch(e){return [];}}
function saveUserRecipes(pi,arr){try{localStorage.setItem('user_recipes_'+pi,JSON.stringify(arr));}catch(e){}}

function buildProgTabs(){
  var c=document.getElementById('prog-tabs');
  c.innerHTML=PROGRAMS.map(function(p,i){return '<button class="prog-tab'+(i===0?' active':'')+'" onclick="switchProg('+i+')">'+p.label+'</button>';}).join('');
}

function buildDayTabs(){
  var prog=PROGRAMS[currentProg];
  var wrap=document.getElementById('day-tabs-wrap');
  if(prog.food||prog.oats){wrap.style.display='none';return;}
  wrap.style.display='block';
  var c=document.getElementById('day-tabs'), cd=currentDays[currentProg];
  c.innerHTML=prog.days.map(function(d,i){return '<button class="day-tab'+(i===cd?' active':'')+'" onclick="switchDay('+i+')">'+d.shortTab+'</button>';}).join('');
}

function renderFood(){
  var apiKey=getApiKey();
  var html='<div>';
  html+='<div class="day-header"><div class="day-label">Kost för snickare</div><div class="day-name">Mat & Recept</div></div>';

  // API KEY SECTION
  html+='<div class="apikey-section">';
  html+='<div class="apikey-title">🤖 AI Receptscanning</div>';
  if(!apiKey){
    html+='<div class="apikey-text">Ange din Anthropic API-nyckel för att kunna scanna recept från foton. Hämta den på <strong>console.anthropic.com</strong> under API Keys.</div>';
    html+='<input class="apikey-input" type="password" id="apikey-field" placeholder="sk-ant-..." autocomplete="off">';
    html+='<button class="apikey-save-btn" onclick="saveApiKey()">Spara nyckel</button>';
  } else {
    html+='<div style="font-size:13px;color:var(--muted)">API-nyckel sparad ✓ — du kan nu scanna recept med kameran!</div>';
    html+='<button class="apikey-save-btn" style="margin-top:10px;background:transparent;border:1px solid var(--border);color:var(--muted)" onclick="clearApiKey()">Byt nyckel</button>';
  }
  html+='</div>';

  html+='<div class="macro-grid"><div class="macro-card"><div class="macro-num">2 <span class="macro-unit">g/kg</span></div><div class="macro-label">Protein per dag</div></div><div class="macro-card"><div class="macro-num">4–5 <span class="macro-unit">g/kg</span></div><div class="macro-label">Kolhydrater per dag</div></div></div>';
  html+='<div class="food-section-title">Välj proteinkälla</div>';

  PROTEINS.forEach(function(p,pi){
    var userRecipes=getUserRecipes(pi);
    html+='<div class="protein-source">';
    html+='<div class="protein-header" onclick="toggleProtein('+pi+')">';
    html+='<div class="protein-icon">'+p.icon+'</div>';
    html+='<div class="protein-title-wrap"><div class="protein-name">'+p.name+'</div><div class="protein-sub">'+p.sub+'</div></div>';
    html+='<div class="protein-arrow" id="arrow-'+pi+'">▼</div>';
    html+='</div>';
    html+='<div class="protein-recipes" id="recipes-'+pi+'">';
    p.recipes.forEach(function(r){
      html+=renderRecipeItem(r,false,pi,-1);
    });
    userRecipes.forEach(function(r,ri){
      html+=renderRecipeItem(r,true,pi,ri);
    });
    html+='<div style="padding:12px 16px">';
    html+='<button class="scan-btn" onclick="openScanModal('+pi+')" '+(apiKey?'':'disabled style="opacity:.4;cursor:not-allowed"')+'>📸 Scanna nytt recept'+(apiKey?'':' (API-nyckel saknas)')+'</button>';
    html+='</div>';
    html+='</div></div>';
  });
  html+='</div>';
  return html;
}

function renderRecipeItem(r,isUser,pi,ri){
  var html='<div class="recipe-item'+(isUser?' user-added':'')+'">';
  if(isUser) html+='<button class="delete-recipe-btn" onclick="deleteUserRecipe('+pi+','+ri+')">✕</button>';
  html+='<div class="recipe-name">'+r.name+'</div>';
  html+='<div class="recipe-ing-title">Ingredienser</div><div class="recipe-ing">'+r.ing+'</div>';
  html+='<div class="recipe-steps-title">Tillagning</div>';
  r.steps.forEach(function(s,si){html+='<div class="recipe-step"><span class="recipe-step-num">'+(si+1)+'.</span><span>'+s+'</span></div>';});
  html+='<div class="recipe-macros"><span class="rmac">'+r.macros+'</span></div>';
  html+='</div>';
  return html;
}

function saveApiKey(){
  var val=document.getElementById('apikey-field').value.trim();
  if(!val){alert('Ange en API-nyckel!');return;}
  setApiKey(val);
  if(currentView==='log')renderLog();
}
function clearApiKey(){
  try{localStorage.removeItem('claude_api_key');}catch(e){}
  if(currentView==='log')renderLog();
}

function openScanModal(pi){
  scanTargetProtein=pi;
  currentImageBase64='';
  document.getElementById('scan-status').textContent='';
  document.getElementById('scan-go-btn').disabled=true;
  document.getElementById('preview-img').style.display='none';
  document.getElementById('modal-target-label').textContent='Lägger till under: '+PROTEINS[pi].icon+' '+PROTEINS[pi].name;
  document.getElementById('scan-modal').classList.add('show');
}
function closeModal(){
  document.getElementById('scan-modal').classList.remove('show');
  currentImageBase64='';
}

document.getElementById('img-input').addEventListener('change',function(e){
  var file=e.target.files[0];
  if(!file)return;
  var reader=new FileReader();
  reader.onload=function(ev){
    var result=ev.target.result;
    currentImageBase64=result.split(',')[1];
    var img=document.getElementById('preview-img');
    img.src=result;
    img.style.display='block';
    document.getElementById('scan-go-btn').disabled=false;
    document.getElementById('scan-status').textContent='Bild vald — tryck Scanna!';
  };
  reader.readAsDataURL(file);
  this.value='';
});

  var apiKey=getApiKey();
  if(!apiKey||!currentImageBase64){return;}
  var btn=document.getElementById('scan-go-btn');
  var status=document.getElementById('scan-status');
  btn.disabled=true;
  btn.textContent='Analyserar...';
  status.textContent='🤖 Läser av receptet...';

  try{
    var response=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({
        model:'claude-sonnet-4-6',
        max_tokens:1000,
        messages:[{
          role:'user',
          content:[
            {type:'image',source:{type:'base64',media_type:'image/jpeg',data:currentImageBase64}},
            {type:'text',text:'Läs av receptet i den här bilden och returnera ENBART ett JSON-objekt (inga markdown-backticks, inget annat) med dessa exakta fält:\n{"name":"receptnamnet","ing":"ingredienser som en kommaseparerad sträng","steps":["steg 1","steg 2","steg 3"],"macros":"uppskattning av protein och kolhydrater t.ex. ~40g protein · ~50g kolhydrater"}\nOm det inte finns ett recept i bilden, returnera: {"error":"Inget recept hittades"}'}
          ]
        }]
      })
    });
    var data=await response.json();
    if(!response.ok){throw new Error(data.error&&data.error.message||'API-fel');}
    var text=data.content.filter(function(b){return b.type==='text';}).map(function(b){return b.text;}).join('');
    var clean=text.replace(/```json|```/g,'').trim();
    var parsed=JSON.parse(clean);
    if(parsed.error){status.textContent='❌ '+parsed.error;btn.disabled=false;btn.textContent='Scanna recept';return;}
    var userRecipes=getUserRecipes(scanTargetProtein);
    userRecipes.push(parsed);
    saveUserRecipes(scanTargetProtein,userRecipes);
    status.textContent='✅ Recept tillagt!';
    setTimeout(function(){
      closeModal();
      if(currentView==='log')renderLog();
      // Re-open the protein accordion
      setTimeout(function(){
        var r=document.getElementById('recipes-'+scanTargetProtein);
        var a=document.getElementById('arrow-'+scanTargetProtein);
        if(r&&!r.classList.contains('open')){r.classList.add('open');if(a)a.classList.add('open');}
      },100);
    },1200);
  }catch(err){
    status.textContent='❌ Fel: '+err.message;
    btn.disabled=false;
    btn.textContent='Försök igen';
  }
}

function deleteUserRecipe(pi,ri){
  var userRecipes=getUserRecipes(pi);
  userRecipes.splice(ri,1);
  saveUserRecipes(pi,userRecipes);
  if(currentView==='log')renderLog();
  setTimeout(function(){
    var r=document.getElementById('recipes-'+pi);
    var a=document.getElementById('arrow-'+pi);
    if(r){r.classList.add('open');if(a)a.classList.add('open');}
  },50);
}

function toggleProtein(pi){
  var r=document.getElementById('recipes-'+pi),a=document.getElementById('arrow-'+pi);
  var open=r.classList.contains('open');
  r.classList.toggle('open',!open);
  a.classList.toggle('open',!open);
}

function renderOats(){
  var html='<div><div class="day-header"><div class="day-label">Frukost & prep</div><div class="day-name">Overnight Oats</div></div>';
  html+='<div class="oats-intro"><div class="oats-intro-title">Perfekt för snickaren 🥣</div><div class="oats-intro-text">Förbered kvällen innan — klart på morgonen. Tar 2 minuter och ger massor av protein och kolhydrater för en lång arbetsdag.</div></div>';
  html+='<div class="macro-grid"><div class="macro-card"><div class="macro-num">35–50<span class="macro-unit">g</span></div><div class="macro-label">Protein per portion</div></div><div class="macro-card"><div class="macro-num">2 <span class="macro-unit">min</span></div><div class="macro-label">Tillagningstid</div></div></div>';
  html+='<div class="food-section-title">5 Recept</div>';
  OATS_RECIPES.forEach(function(r){
    html+='<div class="exercise-card" style="margin-bottom:12px">';
    html+='<div class="recipe-name" style="font-size:15px;margin-bottom:8px">'+r.name+'</div>';
    html+='<div class="recipe-ing-title">Ingredienser</div><div class="recipe-ing" style="margin-bottom:8px">'+r.ing+'</div>';
    html+='<div class="recipe-steps-title">Gör så här</div>';
    r.steps.forEach(function(s,si){html+='<div class="recipe-step"><span class="recipe-step-num">'+(si+1)+'.</span><span style="font-size:13px;color:var(--muted)">'+s+'</span></div>';});
    html+='<div class="recipe-macros" style="margin-top:8px"><span class="rmac">'+r.macros+'</span></div>';
    html+='<div style="margin-top:8px;padding:8px 12px;background:var(--surface2);border-radius:8px;font-size:12px;color:var(--muted)">💡 '+r.tip+'</div>';
    html+='</div>';
  });
  html+='</div>';
  return html;
}

function renderLog(){
  var main=document.getElementById('main-content');
  var prog=PROGRAMS[currentProg];
  if(prog.food){main.innerHTML=renderFood();return;}
  if(prog.oats){main.innerHTML=renderOats();return;}
  var cd=currentDays[currentProg], html='';
  prog.days.forEach(function(day,di){
    html+='<div class="day-panel'+(di===cd?' active':'')+'" id="panel-'+di+'">';
    html+='<div class="day-header"><div class="day-label">'+day.day+'</div><div class="day-name">'+day.name+'</div></div><div class="tip">'+day.tip+'</div>';
    day.exercises.forEach(function(ex,ei){
      html+='<div class="exercise-card"><div class="ex-header"><div class="ex-number">'+(ei+1)+'</div><div><div class="ex-name">'+ex.name+'</div><div class="ex-sets-info">'+ex.sets+' set · '+ex.reps+' reps · '+ex.rest+' vila</div>'+(ex.badge?'<span class="badge">'+ex.badge+'</span>':'')+'</div></div>';
      html+='<div class="sets-grid-header"><div class="col-label">Set</div><div class="col-label">Vikt (kg)</div><div class="col-label">Reps</div></div><div class="sets-grid">';
      for(var s=0;s<ex.sets;s++){
        var kg=loadVal(currentProg,di,ei,s,'kg'),rp=loadVal(currentProg,di,ei,s,'reps');
        html+='<div class="set-num">'+(s+1)+'</div>';
        html+='<input class="set-input'+(kg?' filled':'')+'" type="number" inputmode="decimal" placeholder="—" value="'+kg+'" data-prog="'+currentProg+'" data-day="'+di+'" data-ex="'+ei+'" data-set="'+s+'" data-field="kg" oninput="handleInput(this)">';
        html+='<input class="set-input'+(rp?' filled':'')+'" type="number" inputmode="numeric" placeholder="—" value="'+rp+'" data-prog="'+currentProg+'" data-ex="'+ei+'" data-set="'+s+'" data-day="'+di+'" data-field="reps" oninput="handleInput(this)">';
      }
      html+='</div><div class="save-row"><button class="clear-btn" onclick="clearEx('+currentProg+','+di+','+ei+')">Rensa</button><span class="saved-indicator" id="saved-'+currentProg+'-'+di+'-'+ei+'">✓ sparat</span></div></div>';
    });
    html+='</div>';
  });
  main.innerHTML=html;
}

function renderHistory(){
  var main=document.getElementById('main-content');
  var html='<div style="padding-top:8px"><div style="font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:.1em;text-transform:uppercase;margin-bottom:16px">Träningshistorik</div>';
  var allKeys=[];
  try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.startsWith('gym_hist_'))allKeys.push(k);}}catch(e){}
  var dates={};
  allKeys.forEach(function(k){var p=k.split('_');var d=p[2];if(!dates[d])dates[d]=[];dates[d].push(k);});
  var sorted=Object.keys(dates).sort().reverse();
  if(!sorted.length){html+='<div style="color:var(--muted);font-size:14px;margin-top:40px;text-align:center">Inga sparade pass ännu.<br><br>Logga ditt första pass!</div>';}
  else{
    sorted.forEach(function(date){
      html+='<div style="margin-bottom:20px"><div style="font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:10px">'+formatDate(date)+'</div>';
      var logged={};
      dates[date].forEach(function(k){
        var m=k.match(/gym_hist_[\d-]+_p(\d+)_d(\d+)_e(\d+)_s(\d+)_(\w+)/);
        if(!m)return;
        var key2=m[1]+'_'+m[2]+'_'+m[3]+'_'+m[4];
        if(!logged[key2])logged[key2]={pi:m[1],di:m[2],ei:m[3],si:m[4]};
        try{logged[key2][m[5]]=localStorage.getItem(k);}catch(e){}
      });
      var grouped={};
      Object.values(logged).forEach(function(e){var gk=e.pi+'_'+e.di+'_'+e.ei;if(!grouped[gk])grouped[gk]={pi:e.pi,di:e.di,ei:e.ei,sets:[]};grouped[gk].sets.push(e);});
      Object.values(grouped).forEach(function(g){
        var prog=PROGRAMS[g.pi];if(!prog||prog.food||prog.oats)return;
        var day=prog.days[g.di];if(!day)return;
        var ex=day.exercises[g.ei];if(!ex)return;
        html+='<div class="exercise-card" style="margin-bottom:8px"><div style="font-family:var(--mono);font-size:10px;color:var(--muted);margin-bottom:4px">'+prog.label+' · '+day.shortTab+'</div><div class="ex-name" style="margin-bottom:8px">'+ex.name+'</div>';
        g.sets.sort(function(a,b){return a.si-b.si;}).forEach(function(s){if(s.kg||s.reps)html+='<div style="display:flex;gap:8px;font-family:var(--mono);font-size:13px;color:var(--muted);margin-bottom:4px"><span style="color:#444">Set '+(parseInt(s.si)+1)+'</span>'+(s.kg?'<span style="color:var(--accent)">'+s.kg+' kg</span>':'')+' '+(s.reps?'<span>'+s.reps+' reps</span>':'')+'</div>';});
        html+='</div>';
      });
      html+='</div>';
    });
  }
  main.innerHTML=html+'</div>';
}

function formatDate(d){return new Date(d+'T12:00:00').toLocaleDateString('sv-SE',{weekday:'long',day:'numeric',month:'long'});}
function handleInput(el){
  var pi=el.dataset.prog,di=el.dataset.day,ei=el.dataset.ex,si=el.dataset.set,f=el.dataset.field;
  saveVal(pi,di,ei,si,f,el.value);
  el.classList.toggle('filled',!!el.value);
  var ind=document.getElementById('saved-'+pi+'-'+di+'-'+ei);
  if(ind){ind.classList.add('show');setTimeout(function(){ind.classList.remove('show');},1500);}
}
function clearEx(pi,di,ei){
  var prog=PROGRAMS[pi];if(!prog||prog.food||prog.oats)return;
  var ex=prog.days[di].exercises[ei];
  for(var s=0;s<ex.sets;s++){
    try{localStorage.removeItem(sKey(pi,di,ei,s,'kg'));localStorage.removeItem(sKey(pi,di,ei,s,'reps'));}catch(e){}
    ['kg','reps'].forEach(function(f){var el=document.querySelector('input[data-prog="'+pi+'"][data-day="'+di+'"][data-ex="'+ei+'"][data-set="'+s+'"][data-field="'+f+'"]');if(el){el.value='';el.classList.remove('filled');}});
  }
}
function switchProg(idx){currentProg=idx;document.querySelectorAll('.prog-tab').forEach(function(t,i){t.classList.toggle('active',i===idx);});buildDayTabs();if(currentView==='log')renderLog();}
function switchDay(idx){currentDays[currentProg]=idx;document.querySelectorAll('.day-tab').forEach(function(t,i){t.classList.toggle('active',i===idx);});document.querySelectorAll('.day-panel').forEach(function(p,i){p.classList.toggle('active',i===idx);});}
function setView(view){
  currentView=view;
  document.querySelectorAll('.nav-btn').forEach(function(b,i){b.classList.toggle('active',(i===0&&view==='log')||(i===1&&view==='history'));});
  var wrap=document.getElementById('day-tabs-wrap');
  if(view==='history'){wrap.style.display='none';renderHistory();}
  else{buildDayTabs();renderLog();}
}
function updateStreak(){
  try{
    var today=new Date().toISOString().split('T')[0];
    var last=localStorage.getItem('gym_last_visit');
    var streak=parseInt(localStorage.getItem('gym_streak')||'0');
    if(last!==today){var yesterday=new Date(Date.now()-86400000).toISOString().split('T')[0];streak=last===yesterday?streak+1:1;localStorage.setItem('gym_last_visit',today);localStorage.setItem('gym_streak',streak);}
    if(streak>1)document.getElementById('streak-display').textContent='🔥 '+streak+' dagar';
  }catch(e){}
}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}
buildProgTabs(); buildDayTabs(); updateStreak(); renderLog();
</script>
</body>
</html>
